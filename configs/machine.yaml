# sortering-pnp machine settings. Only change what differs from the defaults.
# Lengths in mm, speeds in mm/min. Relative paths are relative to this file's folder.

paths:
  vision: null                 # vision.yaml: nominal camera, measurement (null: Files tab, else the built-in one)
  calibration: null            # camera calibration.json (null: the Files tab's, made in the Calibrate tab)
  head_calibration: null       # the same for the head camera
  models: ../models            # models uploaded in the web page (Models tab), one folder each
  model: null                  # used only while no model is active: NCNN folder / .onnx / .pt (null: upload one in the Models tab)
  stage2: null                 # keypoint model; null: classical length measurement
  layout: ../data/layout.yaml  # bins and working area (edit in the web page)
  transform: ../data/bed_transform.json   # camera -> printer calibration (Calibrate tab)
  runs: ../runs                # photos of every cycle
  claims: ../data/wild_bins.json  # what each wild bin collects (kept across runs)
  users: ../data/users.json    # web page accounts (the first visit creates one)
  state: ../data/state.json    # automatic mode on/off (survives restarts)
  tool: ../data/tool.json      # tip height, measured in the Calibrate tab
  setup: ../data/setup.json    # the Setup tab's checklist
  machine: ../data/machine.json  # limits/positions saved in the Setup tab (they override printer: below)
  files: ../data/files         # files dropped in the Files tab (calibration, items.json, ...)
  todo: ../data/todo.json      # the Setup tab's "On the machine" ticks
  captures: ../data/captures   # calibration photos and the locked camera settings
  sessions: ../data/real       # real-photo sessions (Photos tab)

camera:
  settings: null               # locked camera settings json (locked focus/exposure); null: rpicam-still
  source: overview             # overview: fixed above the bed | head: on the tool head (docs/reference.md)
  mask: true                   # only the tray's inside goes to the model (the rest painted over)
  mask_colour: auto            # auto: the tray floor's colour | #RRGGBB, e.g. #FFFFFF
  mask_margin_mm: 0            # + keeps the wall's foot, - paints more of the floor's edge (Calibrate tab)
  hflip: true                  # the camera flips its picture left-right (both flips: turned 180 deg, a camera mounted the other way round)
  vflip: true                  # ... and top-bottom (Camera Calibration tab: Rotate 90° / Mirror)
  turn90: false                # then turned 90 deg clockwise (in software)
  adjust:                      # Camera Calibration tab: focus, white balance, exposure, image
    focus: auto                # auto | manual (lens_position, dioptres: 1 / metres)
    lens_position: 2.0
    white_balance: auto        # auto | manual (red_gain, blue_gain)
    red_gain: 1.8
    blue_gain: 1.6
    exposure: auto             # auto | manual (exposure_us, gain)
    exposure_us: 20000
    gain: 1.0
    brightness: 0.0            # -1 .. 1
    contrast: 1.0              # 0 .. 2
    sharpness: 1.0             # 0 .. 4
    saturation: 1.0            # 0 .. 2
  height_mm: null              # lens above the tray floor without a camera calibration (null: vision.yaml's)
  head:                        # only for source: head
    fov_mm: [80, 60]           # what one photo covers at the photo height, X x Y
    offset: [0, 0]             # image centre minus the tip, X Y (roughly: the photos overlap)
    overlap: 0.25
    margin_cells: 1            # Resync looks this many cells beyond the grid, for new bins

lights:                        # addressable LEDs (WS2812B ring) on GPIO10 / pin 19 (Setup tab: Lights)
  enabled: false               # there are lights; DIN -> pin 19, 5V -> pin 2, GND -> pin 6
  count: 8                     # LEDs in the chain (LumenPnP ring: 8)
  colour: "#ffffff"            # #RRGGBB
  brightness: 0.5              # 0..1
  always_on: true              # lit while sortering-pnp runs (false: only for photos)
  settle_s: 0.3                # photos only: lit this long before the photo
  order: GRB                   # colour order of the LEDs (WS2812B: GRB)
  spi_bus: 0                   # /dev/spidev0.0 (SPI0 MOSI = GPIO10)
  spi_device: 0

printer:
  driver: moonraker            # moonraker (Klipper on this Pi) | sim (simulated, nothing moves)
  url: http://localhost:7125   # Moonraker
  photo_position: [0, 220, 60] # tip X Y Z for photos and standby: bed all the way out, head out of the picture
  change_position: [110, 220, 100]  # tip X Y Z where the head waits while the picker is put on (head high, bed out)
  travel_z: 50                 # tip height for moves across the bed (above the bins)
  feed_xy: 6000
  feed_z: 1200
  limits_x: [0, 220]           # toolhead limits (soft limits, checked before every move)
  limits_y: [0, 220]
  limits_z: [0, 120]
  max_hotend_c: 50             # refuse to run while the hotend is hotter
  auto_home: true              # G28 when an axis is not homed
  home_macro: _SORTERING_HOME  # Z is homed over the middle of the working area (null: plain G28)
  tool_macro: _SORTERING_TOOL  # Klipper macro whose `tool` must be "picker" (null: no check)
  tool_picker: TOOL_PICKER     # the Setup tab's Picker step, OK: the picker is on (sorting may move it)
  tool_hotend: TOOL_HOTEND     # the printer menu's "Hotend mounted": sorting refused (e.g. to print)
  accel: null                  # mm/s^2 while sorting: lower = gentler bed, loose parts stay put (null: printer's)
  xy_motion:                   # X/Y acceleration profile: every move that changes X or Y (docs/reference.md)
    enabled: true              # false: plain moves (one G1 at the printer's acceleration)
    accel_x: 3000              # mm/s^2 for the head (the X part of a move)
    accel_y: 1000              # mm/s^2 for the bed (the Y part): gentle, loose parts ride on it
    carrying: 0.6              # accel_x x this while the picker holds a part (1: no change)
    profile: s_curve           # s_curve: speed rises and falls along an S (short G1 steps) | trapezoid: one G1
    max_feed_x: null           # mm/min for the head (its X part); null: feed_xy
    max_feed_y: null           # mm/min for the bed (its Y part); null: feed_xy
    steps: 8                   # s_curve: speed steps per ramp
    min_step_mm: 1.0           # s_curve: steps at least this long on average (short moves get fewer)

tool:
  offset: [0, 0, 0]            # picker tip minus the toolhead position Klipper reports (X Y Z)

picker:
  mode: suction                # servo_tweezers | suction | magnet | pneumatic_tweezers (Setup tab: Picker)
  action_pin: 12               # GPIO (header pin 32): pump's MOSFET module, or jaw/magnet servo (sortering-pnp switches it, not Klipper)
  turn_pin: 13                 # GPIO (header pin 33): the tweezers' turning servo
  pwm_chip: null               # /sys/class/pwm/pwmchipN for the servos (null: the first one)
  grab_angle: null             # servo angle that holds (null: the type's, e.g. jaws 20, magnet 160)
  release_angle: null          # servo angle that lets go (null: the type's, e.g. jaws 90, magnet 20)
  rotate_offset_deg: 0         # fine trim of the jaw angle
  rotate_macro: null           # tweezers on a stepper: SORTERING_ROTATE (klipper/sortering_pnp.cfg); null = the servo on turn_pin
  rotate_home: null            # with rotate_macro: SORTERING_ROT_HOME finds 0 degrees before every sort
  grip_from_head_mm: 1.5       # tweezers close at least this far below a screw head
  approach_mm: 8               # slow descent over the last mm
  depth_mm: 0.5                # vacuum: press this far below the part's top (spring-loaded cup)
  grip_height: 0.5             # gripper/tweezers: close at this share of the part's height (screws: the shank's middle)
  clearance_mm: 1.0            # parts with this much free space around them are picked first
  drop_mm: 10                  # release at least this far above the bin's rim
  lower_to_drop: false         # lower to rim + drop_mm before letting go (false: let go at travel_z; Setup tab, Picker)
  dwell_s: 0.3
  feed_z_slow: 300

run:
  strategy: sort               # sort | clear | kit
  min_score: 0.5               # less confident detections go to the "unsure" bin
  kit: {}                      # kit strategy, e.g. {DIN912_M3x10: 4, DIN934_M3: 4}
  max_failed_picks: 3
  failed_radius_mm: 4.0
  work_margin_mm: 3.0
  keep_photos: 300
  order: census                # census: biggest kind first, finish it, back to a kind that turns up again | largest_group | nearest
  scan_bins_on_start: true     # find the bins with the camera when a run starts (new markers = wild bins)
  only_seen_bins: true         # use only the bins the camera sees in that first photo
  startup_check: true          # first run after a start: home, resync, look into the bins (Device tab)
  shake:
    enabled: true              # shake the bed to spread clumps when nothing can be picked
    axis: Y                    # Y for bed-slingers (Ender 3, Prusa MK3)
    moves: 6
    distance_mm: 4
    feed: 9000
    max_in_a_row: 3
  fill:                        # how full the bins are (an estimate, docs/reference.md)
    shape: 0.5                 # a part's volume = outline area x height x this
    packing: 0.3               # loose parts fill this share of a bin's room
    full_at: 0.9               # a bin this full asks to be emptied
    catalogue: true            # exact volumes from items.json (Files tab), when there is one
    learn: true                # Full on a bin teaches how densely its family packs
  when_no_bin: ask             # a new kind, no free wild bin: ask for a bin change | overflow
  share_wild: class            # ... but first share a wild bin: class (other length) | family | none
  check_emptied: true          # after a bin change, parts still seen in a bin are counted

standby:                       # automatic mode
  interval_s: 60               # look for new parts this often
  min_parts: 1
  motors_off: true             # quiet while waiting; homes again before sorting
  max_errors: 3                # switch automatic mode off after this many errors in a row

models:
  classifier_conf: 0.6         # a classifier model overrules stage 1 only when at least this sure
  use_recommended_conf: true   # stage-1 confidence from the model card, when it has one
  prefer: [ncnn, onnx, pt]     # which weights of an upload to use (NCNN is fastest on the Pi)
  max_upload_mb: 2000

web:
  port: 8080
  require_login: true          # user name + password for the page (false: open to the whole network)
  session_days: 30             # stay logged in this long per browser

calibration:                   # Calibrate tab: the camera calibration on the Pi
  board:                       # the tray board: 105 x 90 mm, lies flat in a 3x3 tray
    squares_x: 7
    squares_y: 6
    square_mm: 15.0            # as printed; the measured size is entered in the page
    marker_mm: 11.0
    dictionary: DICT_5X5_100
  board_thickness_mm: 0.0      # the board lies on the TPU sheet: its thickness lifts it
  lens_distance_mm: 300        # roughly camera to plate: where the focus sweep starts
  area_mm: [220, 220]          # the model's view around the board (as in its training)
  margin_mm: 5
