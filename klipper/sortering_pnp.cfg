# sortering_pnp: Klipper side. install-pi.sh puts it next to printer.cfg (~/printer_data/config/)
# and adds  [include sortering_pnp.cfg]  to printer.cfg, once, AFTER your own sections (some
# settings below change sections of printer.cfg, and in Klipper the later value wins), then
# restarts Klipper. By hand:  ~/sortering-pnp/.venv/bin/sortering-pnp klipper
# Don't edit this copy: the installer replaces it (and keeps the old one as .bak). The picker is
# not in Klipper: sortering-pnp switches the Raspberry Pi's pins itself (Setup tab, Picker).

[respond]
# RESPOND: the macros below say what they did (Mainsail's mainsail.cfg has it too: no harm)

# ---------------------------------------------------------------- the bed: home Y gently
# Loose parts lie on the bed. Homing ends with the bed stopping at its switch (no ramp there):
# slow it down. These replace printer.cfg's values (this file is included after them).
[stepper_y]
homing_speed: 20              # mm/s (the Ender 3 example: 50)
second_homing_speed: 5        # the slow second touch

# ---------------------------------------------------------------- which tool is mounted
# The sorter only moves when tool = "picker". Run TOOL_PICKER after mounting the picker,
# TOOL_HOTEND after putting the hotend back. The choice survives restarts (save_variables).
[save_variables]
filename: ~/printer_data/config/sortering_pnp_variables.cfg

[gcode_macro _SORTERING_TOOL]
variable_tool: "hotend"
gcode:
  RESPOND MSG="sortering-pnp: active tool is {printer['gcode_macro _SORTERING_TOOL'].tool}"

[delayed_gcode _SORTERING_RESTORE_TOOL]
initial_duration: 1
gcode:
  {% set saved = printer.save_variables.variables.sortering_pnp_tool|default("hotend") %}
  SET_GCODE_VARIABLE MACRO=_SORTERING_TOOL VARIABLE=tool VALUE='"{saved}"'

[gcode_macro TOOL_PICKER]
description: The picker is mounted (heaters off, sorting allowed)
gcode:
  TURN_OFF_HEATERS
  SET_GCODE_VARIABLE MACRO=_SORTERING_TOOL VARIABLE=tool VALUE='"picker"'
  SAVE_VARIABLE VARIABLE=sortering_pnp_tool VALUE='"picker"'
  RESPOND MSG="sortering-pnp: picker mounted"

[gcode_macro TOOL_HOTEND]
description: The hotend is mounted (printing allowed, sorting refused)
gcode:
  SET_GCODE_VARIABLE MACRO=_SORTERING_TOOL VARIABLE=tool VALUE='"hotend"'
  SAVE_VARIABLE VARIABLE=sortering_pnp_tool VALUE='"hotend"'
  RESPOND MSG="sortering-pnp: hotend mounted"

# ---------------------------------------------------------------- homing
# G28 never runs into a bin: lift first, home X and Y, then home Z with the tool over the middle
# of the working area (flat TPU plate, no bins), then lift again. sortering_pnp sets z_home_x/y from
# the layout before it homes; the values below are only used when you home by hand.
# printer.cfg must have no [safe_z_home] (Klipper allows only one of the two): the installer
# comments it out.
# The lift counts from wherever Z is (it is unknown before homing): keep the head below
# (Z max - lift) when switching off, e.g. at the photo position.
[gcode_macro _SORTERING_HOME]
variable_z_home_x: 110        # toolhead X over the middle of the working area
variable_z_home_y: 110
variable_lift: 30             # mm: more than the bins are tall
gcode:
  RESPOND MSG="sortering-pnp: Z homes at X{printer['gcode_macro _SORTERING_HOME'].z_home_x} Y{printer['gcode_macro _SORTERING_HOME'].z_home_y}"

[homing_override]
axes: xyz
set_position_z: 0
gcode:
  {% set h = printer["gcode_macro _SORTERING_HOME"] %}
  {% set all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
  {% set homed = printer.toolhead.homed_axes %}
  G90
  G1 Z{h.lift} F600
  {% if all or 'X' in params or ('Z' in params and 'x' not in homed) %}
    G28 X
  {% endif %}
  {% if all or 'Y' in params or ('Z' in params and 'y' not in homed) %}
    G28 Y
  {% endif %}
  {% if all or 'Z' in params %}
    G1 X{h.z_home_x} Y{h.z_home_y} F6000
    G28 Z
    G1 Z{h.lift} F600
  {% endif %}

# If the picker tip reaches lower than the nozzle did, see "Homing" in docs/reference.md: the Z
# switch is raised so it triggers with the tip above the plate, and Z may then go a little
# below 0 during a pick, e.g. in printer.cfg:  [stepper_z]  position_min: -5

# ---------------------------------------------------------------- smoother ramps (optional)
# The bed's moves ramp at a low acceleration (machine.yaml: printer.xy_motion). Klipper's input
# shaper also rounds the start and end of each ramp. Put it in printer.cfg, NOT here: Klipper's
# SHAPER_CALIBRATE + SAVE_CONFIG write [input_shaper] into printer.cfg and refuse when an included
# file has it. E.g.:
#   [input_shaper]
#   shaper_type_y: ei
#   shaper_freq_y: 20

# ---------------------------------------------------------------- printer menu -> sortering_pnp
# The sortering_pnp program on the Pi receives these through Moonraker.
[gcode_macro SORTERING]
description: Send a command to the sorter (CMD=auto|start|step|pause|resume|stop|ok STRATEGY=sort|clear|kit)
gcode:
  {% set cmd = params.CMD|default("start")|lower %}
  {% set strategy = params.STRATEGY|default("")|lower %}
  {action_call_remote_method("sortering_pnp", command=cmd, strategy=strategy)}
  RESPOND MSG="sortering-pnp: {cmd} {strategy}"

[menu __main __sortering_pnp]
type: list
name: Screw sorter

[menu __main __sortering_pnp __auto]
type: command
name: Automatic
gcode: SORTERING CMD=auto STRATEGY=sort

[menu __main __sortering_pnp __sort]
type: command
name: Sort
gcode: SORTERING CMD=start STRATEGY=sort

[menu __main __sortering_pnp __clear]
type: command
name: Clear plate
gcode: SORTERING CMD=start STRATEGY=clear

[menu __main __sortering_pnp __kit]
type: command
name: Pick kit
gcode: SORTERING CMD=start STRATEGY=kit

[menu __main __sortering_pnp __step]
type: command
name: One pick
gcode: SORTERING CMD=step

[menu __main __sortering_pnp __ok]
type: command
name: Change bin
gcode: SORTERING CMD=ok

[menu __main __sortering_pnp __pause]
type: command
name: Pause
gcode: SORTERING CMD=pause

[menu __main __sortering_pnp __resume]
type: command
name: Resume
gcode: SORTERING CMD=resume

[menu __main __sortering_pnp __stop]
type: command
name: Stop
gcode: SORTERING CMD=stop

[menu __main __sortering_pnp __picker]
type: command
name: Picker mounted
gcode: TOOL_PICKER

[menu __main __sortering_pnp __hotend]
type: command
name: Hotend mounted
gcode: TOOL_HOTEND

# ---------------------------------------------------------------- PICKER HARDWARE
# The picker (servo tweezers, suction cup, magnet or pneumatic tweezers) is wired to the
# Raspberry Pi's own pins, and sortering-pnp switches them itself: nothing for it here. (An older
# sortering_pnp_picker.cfg next to this file is no longer read; it can be deleted.)

# ---------------------------------------------------------------- TWEEZERS ON A STEPPER (optional)
# Instead of the turning servo on the Pi's GPIO13, tweezers can turn on a stepper motor driven by
# Klipper. Uncomment ONE of the two variants below and set in configs/machine.yaml
# picker.rotate_macro: SORTERING_ROTATE (variant B also picker.rotate_home: SORTERING_ROT_HOME).
# 0 degrees = the jaws close along printer X.
#
# A) The rotation motor on the EXTRUDER driver (unplug the extruder motor, plug the tweezer motor
#    in): the [extruder] section stays as it is, so the hotend still prints after a tool swap.
#    FORCE_MOVE turns it without the "cold extrusion" check. The angle is remembered (also over a
#    restart); set 0 by hand once: turn the jaws to close along X, then SORTERING_ROT_ZERO in
#    Mainsail's console (machine.yaml: picker.rotate_home: null).
#[force_move]
#enable_force_move: True
#
#[gcode_macro SORTERING_ROTATE]
#description: Turn the tweezers so their jaws close along ANGLE (deg, 0 = printer X)
#variable_angle: 0.0
#variable_mm_per_deg: 0.0931   # extruder mm per degree of the tweezers: rotation_distance / 360
#                              # x gear ratio (33.5 / 360 = 0.0931 for a direct 1:1 drive)
#gcode:
#  {% set r = printer["gcode_macro SORTERING_ROTATE"] %}
#  {% set target = params.ANGLE|default(0)|float %}
#  {% set delta = target - r.angle %}
#  {% if delta|abs > 0.05 %}
#    FORCE_MOVE STEPPER=extruder DISTANCE={delta * r.mm_per_deg} VELOCITY=10
#  {% endif %}
#  SET_GCODE_VARIABLE MACRO=SORTERING_ROTATE VARIABLE=angle VALUE={target}
#  SAVE_VARIABLE VARIABLE=sortering_pnp_angle VALUE={target}
#
#[gcode_macro SORTERING_ROT_ZERO]
#description: The jaws close along printer X right now: this is 0 degrees
#gcode:
#  SET_GCODE_VARIABLE MACRO=SORTERING_ROTATE VARIABLE=angle VALUE=0
#  SAVE_VARIABLE VARIABLE=sortering_pnp_angle VALUE=0
#
#[delayed_gcode _SORTERING_RESTORE_ANGLE]
#initial_duration: 1
#gcode:
#  SET_GCODE_VARIABLE MACRO=SORTERING_ROTATE VARIABLE=angle VALUE={printer.save_variables.variables.sortering_pnp_angle|default(0)}
#
# B) A spare stepper driver and a small switch (or hall sensor) at 0 degrees: the axis finds 0
#    by itself before every sort (machine.yaml: picker.rotate_home: SORTERING_ROT_HOME).
#    Copy the pins from an unused driver of your board.
